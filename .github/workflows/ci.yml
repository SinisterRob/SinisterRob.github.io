name: Site Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-site:
    name: CSS / JS / WASM Appearance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright & Chromium
        run: |
          python -m pip install --upgrade pip playwright
          playwright install chromium

      - name: Run site appearance & WASM checks
        run: python3 scripts/verify-site.py
