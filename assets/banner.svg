<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-label="sinisterrob.github.io — Actuarial portfolio and Rust/WASM labs">
  <defs>
    <radialGradient id="bg" cx="35%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0e1926"/>
      <stop offset="100%" stop-color="#0a131d"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>

  <!-- Wordmark & subtitle matching pricing-kernels / reserving-kernels -->
  <text x="128" y="304" fill="#f3ebd4" font-family="Inter, 'Noto Sans', sans-serif" font-size="92" font-weight="700" letter-spacing="-2.4">sinisterrob.github.io</text>
  <text x="132" y="388" fill="#e8dfc7" font-family="Inter, 'Noto Sans', sans-serif" font-size="44" font-weight="400" letter-spacing="-0.4">Actuarial portfolio &amp; Rust/WASM labs</text>

  <!-- Right geometric emblem: excess layer bars + development triangle curve -->
  <g transform="translate(1168, 178)">
    <!-- Subtle frame grid (muted teal) -->
    <rect x="0" y="0" width="296" height="276" rx="10" fill="none" stroke="#538282" stroke-width="5" stroke-opacity="0.55"/>

    <!-- Horizontal layer reference rules -->
    <line x1="28" y1="74" x2="268" y2="74" stroke="#538282" stroke-width="3" stroke-opacity="0.45"/>
    <line x1="28" y1="142" x2="268" y2="142" stroke="#538282" stroke-width="3" stroke-opacity="0.45"/>
    <line x1="28" y1="210" x2="268" y2="210" stroke="#538282" stroke-width="3" stroke-opacity="0.45"/>

    <!-- Lower observed/primary blocks (warm cream) -->
    <rect x="34" y="182" width="44" height="60" rx="3" fill="#f3ebd4"/>
    <rect x="92" y="148" width="44" height="94" rx="3" fill="#f3ebd4"/>
    <rect x="150" y="114" width="44" height="128" rx="3" fill="#f3ebd4" stroke="#cc6b2c" stroke-width="5"/>
    <rect x="208" y="80" width="44" height="162" rx="3" fill="none" stroke="#538282" stroke-width="5"/>

    <!-- Smooth concave ILF / emergence curve in rust-orange -->
    <path d="M 34 222 C 88 152, 152 104, 256 62" fill="none" stroke="#cc6b2c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="172" cy="104" r="9" fill="#f3ebd4" stroke="#cc6b2c" stroke-width="5"/>
  </g>
</svg>
