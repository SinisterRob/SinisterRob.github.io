<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Excess Layer and ILF Simulator by Robert Jurgens, FCAS, showing the 1.48× baseline ILF.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#ece6da"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="1144" height="574" rx="22" fill="#fdfcf9" stroke="#dfd9cc" stroke-width="2"/>

  <!-- Editorial accent top rule -->
  <rect x="28" y="28" width="1144" height="8" rx="4" fill="#9e3a12"/>

  <!-- Author and domain -->
  <rect x="82" y="84" width="56" height="56" rx="12" fill="#9e3a12"/>
  <rect x="85.5" y="87.5" width="49" height="49" rx="9" fill="none" stroke="#fdfcf9" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="110" y="121" text-anchor="middle" fill="#fdfcf9" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="500">RJ</text>

  <text x="156" y="106" fill="#9e3a12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="1.8">ROBERT JURGENS, FCAS</text>
  <text x="156" y="130" fill="#525b66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="0.6">sinisterrob.github.io</text>

  <g fill="#14171a" font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="-1.3">
    <text x="82" y="232">Excess Layer &amp;</text>
    <text x="82" y="310">Increased Limits</text>
    <text x="82" y="388">Factor Simulator</text>
  </g>

  <line x1="82" y1="430" x2="730" y2="430" stroke="#dfd9cc" stroke-width="1.5"/>
  <g fill="#525b66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="23">
    <text x="82" y="476">Compare expected layer loss and ILFs</text>
    <text x="82" y="510">across attachment points, limits, and tails.</text>
  </g>

  <!-- Right Panel: Illustrative ILF Curve Graphic -->
  <rect x="786" y="108" width="336" height="436" rx="16" fill="#f7f4ee" stroke="#dfd9cc" stroke-width="1.5"/>
  <text x="814" y="148" fill="#525b66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.2">BASELINE SCENARIO</text>
  <rect x="814" y="162" width="194" height="24" rx="12" fill="#f5e7e0" stroke="#9e3a12" stroke-opacity="0.35"/>
  <text x="911" y="178" text-anchor="middle" fill="#9e3a12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">$250k xs $100k · MODERATE</text>

  <!-- Mini ILF Grid -->
  <g transform="translate(814, 212)">
    <line x1="0" y1="30" x2="280" y2="30" stroke="#dfd9cc" stroke-width="1"/>
    <line x1="0" y1="80" x2="280" y2="80" stroke="#dfd9cc" stroke-width="1"/>
    <line x1="0" y1="130" x2="280" y2="130" stroke="#dfd9cc" stroke-width="1"/>
    <line x1="0" y1="180" x2="280" y2="180" stroke="#c5bdb0" stroke-width="1.5"/>

    <!-- Heavier dashed -->
    <path d="M 0 180 L 7 148.6 L 14 129.6 L 42 90.1 L 77 67.4 L 112 54.6 L 147 46.2 L 182 40.3 L 217 35.9 L 252 32.5 L 280 30.3" fill="none" stroke="#8c96a2" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- Lighter dashed -->
    <path d="M 0 180 L 7 156.3 L 14 134.2 L 42 93.3 L 77 85.9 L 112 85 L 147 84.9 L 280 84.9" fill="none" stroke="#8c96a2" stroke-width="2" stroke-dasharray="6 5"/>
    <!-- Moderate active -->
    <path d="M 0 180 L 7 151.9 L 14 131.1 L 28 105.5 L 35 97.3 L 42 91.1 L 56 82.2 L 70 76.5 L 98 69.7 L 133 65.4 L 168 63.1 L 203 61.9 L 238 61.1 L 280 60.5" fill="none" stroke="#9e3a12" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Active marker -->
    <line x1="98" y1="12" x2="98" y2="180" stroke="#9e3a12" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="98" cy="69.7" r="11" fill="#9e3a12" fill-opacity="0.16"/>
    <circle cx="98" cy="69.7" r="6.5" fill="#9e3a12" stroke="#fdfcf9" stroke-width="2.5"/>
    <text x="98" y="6" text-anchor="middle" fill="#9e3a12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600">$350k · 1.48×</text>

    <text x="0" y="202" fill="#525b66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">$0</text>
    <text x="140" y="202" text-anchor="middle" fill="#525b66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">$500k</text>
    <text x="280" y="202" text-anchor="end" fill="#525b66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">$1M</text>
  </g>

  <!-- Loss Share Strip inside Card -->
  <g transform="translate(814, 448)">
    <rect x="0" y="0" width="171" height="10" rx="5" fill="#2b5478"/>
    <rect x="175" y="0" width="81" height="10" rx="5" fill="#9e3a12"/>
    <rect x="260" y="0" width="20" height="10" rx="5" fill="#8e97a2"/>
    <text x="0" y="34" fill="#2b5478" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600">Primary 61.7%</text>
    <text x="125" y="34" fill="#9e3a12" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600">Excess 29.7%</text>
    <text x="0" y="58" fill="#525b66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">65,536-draw deterministic Rust MC</text>
  </g>
</svg>
